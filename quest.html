<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quests - Astral Tele</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 pb-24 font-sans">
    <header class="bg-white shadow-sm p-4 sticky top-0 z-40 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">My Quests</h1>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        <!-- User Stats -->
        <div class="bg-white rounded-lg shadow-sm border p-4 flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Current Rank</p>
                <div id="questRank" class="mt-1">
                    <span class="px-2 py-1 rounded text-sm font-bold bg-gray-100 text-gray-800 border border-gray-300">Loading...</span>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Total Points</p>
                <p id="questPts" class="text-2xl font-black text-blue-600 mt-1">0</p>
            </div>
        </div>

        <!-- Quests List -->
        <div>
            <h2 class="text-lg font-bold mb-3">Daily & Weekly Quests</h2>
            <div id="questsList" class="space-y-3">
                <p class="text-sm text-gray-500">Loading quests...</p>
            </div>
        </div>
    </main>

    <!-- Floating Menu will be injected dynamically or we copy-paste it here. Let's copy paste for simplicity as it's static HTML currently. -->
    <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white shadow-lg rounded-full flex gap-4 px-4 py-3 z-50 border border-gray-200">
        <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600 w-12">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[9px] mt-1 font-medium">Home</span>
        </a>
        <a href="library.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600 w-12">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-[9px] mt-1 font-medium">Library</span>
        </a>
        <a href="quest.html" class="flex flex-col items-center text-blue-600 w-12">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[9px] mt-1 font-medium">Quest</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600 w-12">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[9px] mt-1 font-medium">Profile</span>
        </a>
    </nav>
    <script src="js/quest.js"></script>
</body>
</html>
