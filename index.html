<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral-Tele Comics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Assuming Telegram WebApp JS is loaded -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24">

    <!-- Header / Search -->
    <header class="bg-white shadow p-4 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold">Astral-Tele</h1>
            <a href="notifications.html" class="relative text-gray-600 hover:text-blue-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
            </a>
        </div>
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="searchInput" placeholder="Search comics..." class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="searchBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Search</button>
        </div>
        
        <!-- Category Pill Navigation -->
        <div class="max-w-4xl mx-auto mt-4 flex overflow-x-auto gap-2 no-scrollbar pb-2" id="categoryNav">
            <button class="category-btn bg-blue-600 text-white px-4 py-1 rounded-full whitespace-nowrap text-sm font-medium" data-category="">All</button>
            <!-- Categories will be injected here via JS -->
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-4xl mx-auto p-4">
        <div id="comicGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Comics will be injected here via JS -->
            <p class="col-span-full text-center text-gray-500 py-10">Loading comics...</p>
        </div>
        
        <!-- Pagination -->
        <div class="flex justify-center mt-8 gap-2" id="paginationControls">
            <!-- Pagination injected via JS -->
        </div>
    </main>

    <!-- Floating Menu -->
    <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white shadow-lg rounded-full flex gap-6 px-6 py-3 z-50 border border-gray-200">
        <a href="index.html" class="flex flex-col items-center text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </a>
        <a href="library.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Library</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Profile</span>
        </a>
    </nav>

    <script src="js/notification_bell.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
