<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral-Tele Comics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Assuming Telegram WebApp JS is loaded -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <!-- Header / Search -->
    <header class="bg-white shadow p-4 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="searchInput" placeholder="Search comics..." class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="searchBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Search</button>
        </div>
        
        <!-- Category Pill Navigation -->
        <div class="max-w-4xl mx-auto mt-4 flex overflow-x-auto gap-2 no-scrollbar pb-2" id="categoryNav">
            <button class="category-btn bg-blue-600 text-white px-4 py-1 rounded-full whitespace-nowrap text-sm font-medium" data-category="">All</button>
            <button class="category-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full whitespace-nowrap text-sm font-medium hover:bg-gray-300" data-category="Action">Action</button>
            <button class="category-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full whitespace-nowrap text-sm font-medium hover:bg-gray-300" data-category="Romance">Romance</button>
            <button class="category-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full whitespace-nowrap text-sm font-medium hover:bg-gray-300" data-category="Fantasy">Fantasy</button>
            <button class="category-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full whitespace-nowrap text-sm font-medium hover:bg-gray-300" data-category="Comedy">Comedy</button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-4xl mx-auto p-4">
        <div id="comicGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Comics will be injected here via JS -->
            <p class="col-span-full text-center text-gray-500 py-10">Loading comics...</p>
        </div>
        
        <!-- Pagination -->
        <div class="flex justify-center mt-8 gap-2" id="paginationControls">
            <!-- Pagination injected via JS -->
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
