<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Astral-Tele</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24">

    <header class="bg-white shadow p-4 sticky top-0 z-10 flex items-center justify-between">
        <h1 class="text-xl font-bold">Library</h1>
        <a href="notifications.html" class="relative text-gray-600 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </a>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <!-- Tabs -->
        <div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar border-b pb-2">
            <button class="tab-btn bg-blue-600 text-white px-4 py-2 rounded-lg font-bold whitespace-nowrap" data-tab="history">History</button>
            <button class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold whitespace-nowrap border" data-tab="bookmarks">Bookmarks</button>
            <button class="tab-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold whitespace-nowrap border" data-tab="purchased">Purchased</button>
        </div>

        <!-- List -->
        <div id="libraryList" class="space-y-3">
            <p class="text-center text-gray-500 py-10">Loading...</p>
        </div>

        <!-- Pagination -->
        <div class="flex justify-center mt-8 gap-2 pb-6" id="paginationControls">
            <!-- Pagination injected via JS -->
        </div>
    </main>

    <!-- Floating Menu -->
    <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white shadow-lg rounded-full flex gap-6 px-6 py-3 z-50 border border-gray-200">
        <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </a>
        <a href="library.html" class="flex flex-col items-center text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Library</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Profile</span>
        </a>
    </nav>

    <script src="js/notification_bell.js"></script>
    <script src="js/library.js"></script>
</body>
</html>
