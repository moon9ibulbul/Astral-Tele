<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Detail - Astral-Tele</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24">

    <header class="bg-white shadow p-4 sticky top-0 z-10 flex items-center justify-between">
        <div class="flex items-center">
            <button onclick="window.history.back()" class="mr-4 text-gray-600 hover:text-black">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <h1 class="text-lg font-bold truncate" id="headerTitle">Loading...</h1>
        </div>
        <a href="notifications.html" class="relative text-gray-600 hover:text-blue-600 shrink-0 ml-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </a>
    </header>

    <main class="max-w-4xl mx-auto bg-white min-h-screen">
        <!-- Metadata Section -->
        <div class="flex flex-col md:flex-row p-4 gap-4 border-b">
            <div class="w-full md:w-1/3 aspect-[3/4] bg-gray-200 rounded-lg overflow-hidden shrink-0">
                <img id="comicThumb" src="" alt="" class="w-full h-full object-cover hidden">
            </div>
            <div class="flex-1 space-y-2">
                <h2 id="comicTitle" class="text-2xl font-bold"></h2>
                <p id="comicAltTitle" class="text-gray-500 italic text-sm"></p>
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-yellow-500">★ <span id="comicRating">0.00</span></span>
                    <span class="text-gray-400">|</span>
                    <div id="comicCategories" class="flex flex-wrap gap-1"></div>
                </div>
                <div class="text-sm space-y-1 mt-4">
                    <p><strong>Author:</strong> <span id="comicAuthor">-</span></p>
                    <p><strong>Artist:</strong> <span id="comicArtist">-</span></p>
                    <p><strong>Publisher:</strong> <span id="comicPublisher">-</span></p>
                    <p><strong>Year:</strong> <span id="comicYear">-</span></p>
                    <p><strong>Status:</strong> <span id="comicStatus">-</span></p>
                    <p><strong>Views:</strong> <span id="comicViews">0</span></p>
                </div>
                <div class="mt-4">
                    <h3 class="font-bold border-b pb-1 mb-2">Synopsis</h3>
                    <p id="comicSynopsis" class="text-sm text-gray-700 leading-relaxed line-clamp-3 whitespace-pre-wrap"></p>
                    <button id="viewMoreBtn" class="text-blue-600 text-sm font-medium mt-1 hidden hover:underline">View More</button>
                </div>
            </div>
        </div>

        <!-- Actions / Features -->
        <div class="px-4 py-2 flex gap-2">
            <button id="bookmarkBtn" class="flex-1 border border-gray-300 text-gray-700 bg-gray-50 hover:bg-gray-100 py-2 rounded-lg font-medium flex items-center justify-center gap-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                <span id="bookmarkText">Bookmark</span>
            </button>
        </div>

        <!-- Chapters Section -->
        <div class="p-4">
            <h3 class="font-bold text-lg mb-4">Chapters</h3>
            <div id="chapterList" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-gray-500 text-sm">Loading chapters...</p>
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="p-4 border-t bg-gray-50">
            <h3 class="font-bold text-lg mb-4">Reviews & Comments</h3>
            
            <!-- Add Review Form -->
            <div class="mb-6 bg-white p-4 rounded-lg shadow-sm border">
                <textarea id="reviewContent" rows="3" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Write a review..."></textarea>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mt-2 gap-2">
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <select id="reviewRating" class="border rounded p-1 text-sm bg-white">
                            <option value="">No Rating</option>
                            <option value="5">5 - Masterpiece</option>
                            <option value="4">4 - Great</option>
                            <option value="3">3 - Good</option>
                            <option value="2">2 - Bad</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                        <div class="relative w-full sm:w-auto">
                            <input type="file" id="reviewImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <button type="button" class="flex items-center gap-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg border border-gray-300 w-full justify-center">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                                <span id="reviewImageLabel">Attach Image</span>
                            </button>
                        </div>
                    </div>
                    <button id="submitReviewBtn" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-blue-700 w-full sm:w-auto shrink-0">Submit</button>
                </div>
            </div>

            <div id="reviewsList" class="space-y-4">
                <p class="text-gray-500 text-sm">Loading reviews...</p>
            </div>
        </div>
    </main>

    <!-- Floating Menu -->
    <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white shadow-lg rounded-full flex gap-6 px-6 py-3 z-50 border border-gray-200">
        <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </a>
        <a href="library.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Library</span>
        </a>
        <a href="quest.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Quest</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Profile</span>
        </a>
    </nav>

    <script src="js/notification_bell.js?v=1.0.1"></script>
    <script src="js/app.js?v=1.0.1"></script>
    <script src="js/detail.js?v=1.0.1"></script>
</body>
</html>
