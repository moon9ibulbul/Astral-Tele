<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - Astral-Tele</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
    <style>
        .page-container {
            position: relative;
            margin-bottom: 0px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body class="bg-gray-900 font-sans antialiased text-gray-100 flex flex-col min-h-screen pb-24">

    <!-- Header Navigation -->
    <header class="bg-gray-800 shadow p-4 sticky top-0 z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="window.history.back()" class="text-gray-300 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <div>
                <h1 class="text-sm font-bold truncate max-w-[150px] md:max-w-xs" id="comicTitle">...</h1>
                <select id="chapterDropdown" class="text-xs bg-gray-700 text-white border border-gray-600 rounded p-1 outline-none mt-1 max-w-[150px] md:max-w-xs">
                    <option value="">Chapter ...</option>
                </select>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button id="prevBtn" class="bg-gray-700 p-2 rounded hover:bg-gray-600 disabled:opacity-50" disabled>&larr;</button>
            <button id="nextBtn" class="bg-gray-700 p-2 rounded hover:bg-gray-600 disabled:opacity-50" disabled>&rarr;</button>
        </div>
    </header>

    <!-- Reader Area (Long Strip) -->
    <main class="flex-1 w-full flex flex-col" id="readerContainer">
        <div id="loadingIndicator" class="text-center py-20 text-gray-400">Loading PDF...</div>
        <!-- Pages will be injected here -->
    </main>

    <!-- Bottom Navigation -->
    <footer class="bg-gray-800 p-4 border-t border-gray-700 flex justify-between items-center mt-auto">
        <button id="bottomPrevBtn" class="bg-gray-700 px-4 py-2 rounded hover:bg-gray-600 text-sm disabled:opacity-50" disabled>Previous Chapter</button>
        <button id="bottomNextBtn" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700 text-sm disabled:opacity-50" disabled>Next Chapter</button>
    </footer>

    <!-- Reactions Section -->
    <section class="bg-gray-100 text-gray-900 p-4 mt-8 pb-0">
        <div class="max-w-3xl mx-auto flex gap-4 justify-center items-center flex-wrap" id="reactionsContainer">
            <!-- Reactions will be injected here -->
        </div>
    </section>

    <!-- Comments Section -->
    <section class="bg-gray-100 text-gray-900 p-4">
        <div class="max-w-3xl mx-auto">
            <h3 class="font-bold text-lg mb-4">Chapter Discussion</h3>
            
            <div class="mb-6 bg-white p-4 rounded-lg shadow-sm border">
                <textarea id="reviewContent" rows="3" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Write a comment about this chapter..."></textarea>
                <div class="flex justify-between items-center mt-2">
                    <div class="relative">
                        <input type="file" id="reviewImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <button type="button" class="flex items-center gap-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg border border-gray-300">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                            <span id="reviewImageLabel">Attach Image</span>
                        </button>
                    </div>
                    <button id="submitReviewBtn" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-blue-700">Submit</button>
                </div>
            </div>

            <div id="reviewsList" class="space-y-4">
                <p class="text-gray-500 text-sm">Loading comments...</p>
            </div>
        </div>
    </section>

    <!-- Floating Menu -->
    <nav class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 shadow-lg rounded-full flex gap-6 px-6 py-3 z-50 border border-gray-700">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </a>
        <a href="library.html" class="flex flex-col items-center text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Library</span>
        </a>
        <a href="quest.html" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Quest</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Profile</span>
        </a>
    </nav>

    <script src="js/reader.js"></script>
</body>
</html>
