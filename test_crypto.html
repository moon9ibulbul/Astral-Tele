<script>
async function test() {
    const password = "mypassword";
    const content = new TextEncoder().encode("Hello World PDF content!");

    // Encrypt
    const keyBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
    const cryptoKey = await crypto.subtle.importKey('raw', keyBuffer, {name: 'AES-CBC'}, false, ['encrypt', 'decrypt']);

    const iv = crypto.getRandomValues(new Uint8Array(16));
    const encrypted = await crypto.subtle.encrypt({name: 'AES-CBC', iv: iv}, cryptoKey, content);

    // Combine IV and encrypted
    const combined = new Uint8Array(iv.length + encrypted.byteLength);
    combined.set(iv);
    combined.set(new Uint8Array(encrypted), iv.length);

    console.log("Encrypted length:", combined.length);

    // Decrypt
    const decIv = combined.slice(0, 16);
    const decData = combined.slice(16);
    const decrypted = await crypto.subtle.decrypt({name: 'AES-CBC', iv: decIv}, cryptoKey, decData);

    console.log("Decrypted:", new TextDecoder().decode(decrypted));
}
test();
</script>
